# Scaling Ladder V9.1 T4：h1280 / L20（15 SWA + 5 full，全 MLA nope192+rope64/v256/kv_lora 512，SWA:full 3:1 每 4 层成组，window 128，sink bias，无 MTP）/ 20 heads / q_lora 512 / 768 选 12 / latent 640 / Expert FFN 1152（1.80·latent，shared 同）/ 无 dense 层（first_k_dense_replace 0，intermediate_size 4480 占位）
# 去掉：第 1 层 dense FFN（全 MoE）/ mHC / MTP（2026-09-23 按算法侧要求去掉，model_config num_nextn_predict_layers=0）/ multimax / LoRA-rank gated attention / MoE 层 learnable scalar / multi-router / VHA / HCA；优化器 MuonH / AdamW / AdamH（分组见 optimizer_config）+ QB（topk_method quantile_balancing，moe_router_load_balancing_type none，无 aux loss）
# Total 34.93B / Active 1.232B / actNE 0.975B；D = 2.06T tokens（ρ0 = 2112）；C = 1.20e+22；LR 4.21e-03、global_batch 768 条×8192、max_steps 327328、WSD warmup 750 / stable 293845 / decay 32733
# 蓝本：ernie5_5_flash-pretrain-8k-bzz3-layer43_mla_hca.yaml（ernie5_5_flash_43层_0828），改 model_name_or_path / output_dir / global_batch_size / max_steps / learning_rate / lr_scheduler / recompute_modules，注释掉 mhc / csa / dsv4 开关，关闭 MTP；并行度已按档位配置
#
# 卡数区间：
#   - **推荐卡数 = 最小可跑卡数 = 16 卡** = pp2 × dp8
#     （ep >= 8 且 ep 必须整除 dp ⇒ dp >= 8 ⇒ 卡数 >= pp × 8）；mb2 需配 fuse_optimizer_states=false 才装得下。
#   - **8 卡不可行**（8 卡上 pp 只能是 1：pp2 ⇒ dp4，ep8 除不尽）。
#   - 卡数上限 = gbs/mb × pp = 384 × 2，远超实际可用规模，不是约束。
#   - 往上扩只改 ga：dp = 卡数/2 ⇒ ga = 768/(2×dp)。
#     但 ga 同时是 pp 的流水线深度来源，ga 过小会抬高气泡占比，那时更合理的是同时加大 pp 而不是纯扩 dp。
#   - ga 不能省：不写时默认 1，同样撞 pretraining_trainer.py:2008 的检查而 raise。
#   - 卡数 → ga 对照（mb2）：
#       16 卡 ⇒ dp8 ⇒ ga 48
#       32 卡 ⇒ dp16 ⇒ ga 24
#       64 卡 ⇒ dp32 ⇒ ga 12
#       128 卡 ⇒ dp64 ⇒ ga 6
#       256 卡 ⇒ dp128 ⇒ ga 3

