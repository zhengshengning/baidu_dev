# ===================== 优化器配置（MuonH 骨干 + AdamW embedding/router/norm/sink + AdamH lm_head）=====================
# params 正则须覆盖每个参数恰好一次；漏配或重叠都会报错。
# muonh/adamh 用 Hyperball 约束替代 WD（不施加衰减），weight_decay 写 0。
# 各组可分别设置 optimizer / learning_rate / weight_decay / 调度 / 优化器超参；max_grad_norm 须各组一致。
# 各组 learning_rate 均为本档 η，未施加额外的分组学习率倍率。
# η 沿用原配置标注的 AdamW-fit Step Law 初值，Hyperball 下仍需校准。
# 原配置公式：η ≈ 1.79×N^-0.713×D^0.307（N=actNE 参数个数，D=训练 token 个数）；仓库未附原始拟合记录。
use_mixed_optimizer: true  # optimizer_config（param-group 形式）必须为 true
optimizer_config:
  - params: "(q_a_proj|q_b_proj|kv_a_proj_with_mqa|kv_b_proj|o_proj|fc1_latent_proj|fc2_latent_proj|grouped_gemm_experts|down_proj|up_gate_proj|eh_proj)"
    optimizer: muonh
    learning_rate: 4.21e-3       # 本档 η（沿用原值，Hyperball 下仍需校准）
    weight_decay: 0                 # Hyperball 替代 WD
    lr_scheduler: wsd:294595
    warmup_steps: 750
    min_lr: 0
    max_grad_norm: 1.0
    momentum: 0.95
    version: 3
    ns_steps: 5
    ns_coeff_type: "quintic"
    extra_scale_factor: 0.2
    qkv_update_mode: "split_head"
    ffn_split: true
    epsilon: 1e-15               # muon_epsilon（NS 正交化）
  - params: "(embed|mlp\\.gate)"
    optimizer: adamw              # 2D 可衰减参数（embed / mlp.gate）：衰减量级 = 本组 weight_decay
    learning_rate: 4.21e-3       # 本档 η（沿用原值）
    weight_decay: 0.1
    lr_scheduler: wsd:294595
    warmup_steps: 750
    min_lr: 0
    max_grad_norm: 1.0
    beta1: 0.9
    beta2: 0.95
    epsilon: 1e-15               # adam_epsilon
  - params: "(norm|softmax_offset)"
    optimizer: adamw              # 1D / 不衰减参数（norm / softmax_offset）：本组 weight_decay=0
    learning_rate: 4.21e-3       # 本档 η（沿用原值）
    weight_decay: 0
    lr_scheduler: wsd:294595
    warmup_steps: 750
    min_lr: 0
    max_grad_norm: 1.0
    beta1: 0.9
    beta2: 0.95
    epsilon: 1e-15               # adam_epsilon
  - params: "(lm_head)"
    optimizer: adamh              # AdamW 方向 + Hyperball 球面约束（lm_head 2D）
    learning_rate: 4.21e-3       # = η
    weight_decay: 0               # adamh 不衰减（Hyperball 替代 WD）
    lr_scheduler: wsd:294595
    warmup_steps: 750
    min_lr: 0
    max_grad_norm: 1.0
    beta1: 0.9
    beta2: 0.95
    epsilon: 1e-15               # adam_epsilon

